    </style>
  </head>
  <body>
    <div id="app"></div>
      <script>
const players = [
  ["岳塏", 11], ["星宏", 11], ["健益", 10], ["季汝", 10], ["瑞慈", 8],
  ["沛彤", 8], ["凱均", 8], ["奕康", 6], ["子涵", 6], ["庭芝", 6]
].map(([name, level]) => ({ name, level, present: true }));

const levelStandards = [
  [1, "新手", "剛接觸羽球，學會比賽規則，並懂得比賽禮儀"],
  [2, "新手", "在中場距離中高球來回 10 拍，發球有一半以上成功率"],
  [3, "新手", "定點有一半可以打到 2/3 場後，發球有 9 成以上成功率"],
  [4, "初中", "定點長球男生可以打到後場，女生可以打到中後場，會基本平推、正反轉拍不順暢"],
  [5, "初中", "略懂基本腳步，基本球路在非受迫時有一定的表現"],
  [6, "初中", "略懂基本腳步與輪轉，尚不熟練；已開始殺球與切球，非受迫時移動長球可至中後場"],
  [7, "中階", "殺球、切球或長球有 7 成以上成功率及穩定性。有基本防守能力，但無變化"],
  [8, "中階", "有基本戰略及打點，熟悉輪轉概念；切殺長吊均有 7 成以上準確性，防守有些微變化"],
  [9, "中階", "切殺長吊有 9 成以上準確性及質量，發力及力道稍有強度，防守有一定程度變化及穩定性"],
  [10, "中進", "輪轉概念熟稔並能活化運用，策略性戰略及打點皆能有效得分"],
  [11, "中進", "切殺長吊皆具準確性，發力及速度、策略兼具，輕鬆完成反拍各種球路。防守具威脅性"],
  [12, "中進", "有高速度移位及靈敏走位與步法，殺切吊都具有高強度侵略性，常有一擊必殺的球路"],
  [13, "高階", "各種球路都穩定熟練、防守無死角、球速快質量高、戰略組織及爆發力皆屬上等"],
  [14, "高階", "各種球路都穩定熟練、防守無死角、球速快質量高、戰略組織及爆發力皆屬上等"],
  [15, "高階", "各種球路都穩定熟練、防守無死角、球速快質量高、戰略組織及爆發力皆屬上等"]
].map(([level, band, description]) => ({ level, band, description }));

const rotations = [
  { a: ["岳塏", "瑞慈"], b: ["健益", "庭芝"], rest: ["星宏", "季汝", "沛彤", "凱均", "奕康", "子涵"] },
  { a: ["星宏", "子涵"], b: ["季汝", "沛彤"], rest: ["岳塏", "瑞慈", "健益", "庭芝", "凱均", "奕康"] },
  { a: ["岳塏", "庭芝"], b: ["健益", "奕康"], rest: ["星宏", "季汝", "瑞慈", "沛彤", "凱均", "子涵"] }
];

const state = {
  nextIndex: 0, completed: 8, modal: null, selectedTab: "總覽", notice: "", currentPlayer: 0, assessmentLevel: 11,
  courts: 2, courtOptions: [1, 2, 3], scoreGame: null,
  scores: { 1: "21 : 17", 2: "19 : 21", 3: "21 : 14", 4: "18 : 21", 5: "21 : 18", 6: "21 : 16", 7: "21 : 16", 8: "18 : 21" },
  rules: [
    { label: "避免強 + 強", enabled: true }, { label: "避免弱 + 弱", enabled: true },
    { label: "避免重複搭檔", enabled: true }, { label: "避免重複對手", enabled: true },
    { label: "避免連續上場", enabled: true }, { label: "平衡休息時間", enabled: true }
  ]
};
const SCORE_STORAGE_KEY = "smart-badminton-scheduler:scores:v1";
function restoreSavedScores() {
  try {
    const saved = JSON.parse(localStorage.getItem(SCORE_STORAGE_KEY) || "null");
    if (!saved || typeof saved !== "object") return;
    if (saved.scores && typeof saved.scores === "object") state.scores = saved.scores;
    if (Number.isInteger(saved.completed) && saved.completed >= 0) state.completed = saved.completed;
  } catch { /* Local storage can be unavailable for some file viewers. */ }
}
function persistScores() {
  try {
    localStorage.setItem(SCORE_STORAGE_KEY, JSON.stringify({ scores: state.scores, completed: state.completed, savedAt: new Date().toISOString() }));
    return true;
  } catch { return false; }
}
restoreSavedScores();
const app = document.querySelector("#app");

const icon = (name, size = 18) => {
  const paths = {
    shuttle: '<path d="M7.3 16.7 4.7 19.3M11.7 12.3l-6-6m9.6 1.3-5.3 5.3M18.3 5.7a4.2 4.2 0 0 0-6 0l-1.7 1.7 4.3 4.3 1.7-1.7a4.2 4.2 0 0 0 0-6Zm-6.6 7.6 1.7 1.7M5 19l-1 1m4-4-1 1"/>',
    grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
    users: '<circle cx="9" cy="8" r="3"/><path d="M3.8 20a5.2 5.2 0 0 1 10.4 0M16 5.5a3 3 0 0 1 0 5.7M17.4 14.8a4.8 4.8 0 0 1 2.8 4.4"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
    chart: '<path d="M4 20V10m6 10V4m6 16v-7m6 7V7"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.1 2.1-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-3v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-2.1-2.1.1-.1A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.5-1H5.3v-3h.2A1.7 1.7 0 0 0 7 10a1.7 1.7 0 0 0-.3-1.9l-.1-.1 2.1-2.1.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h3v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 2.1 2.1-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2v3h-.2a1.7 1.7 0 0 0-1.5 1Z"/>',
    play: '<path d="m9 5 10 7-10 7V5Z"/>',
    refresh: '<path d="M20 11a8 8 0 0 0-14.9-3M4 4v5h5M4 13a8 8 0 0 0 14.9 3M20 20v-5h-5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    close: '<path d="m6 6 12 12M18 6 6 18"/>',
    check: '<path d="m5 12 4 4L19 6"/>',
    bell: '<path d="M18 9a6 6 0 0 0-12 0c0 7-3 6-3 8h18c0-2-3-1-3-8ZM10 20h4"/>'
  };
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name]}</svg>`;
};

function levelName(level) { return levelStandards.find(item => item.level === level)?.band || "未分級"; }
function levelBadge(level) { return `<span class="level-badge level-${levelName(level)}">${levelName(level)} ${level} 級</span>`; }
function initials(name) { return name.slice(0, 1); }
function match() { return rotations[state.nextIndex]; }

function render() {
  const m = match();
  const present = players.filter(p => p.present);
  app.innerHTML = `
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" aria-label="球序首頁"><span class="brand-mark">${icon("shuttle", 23)}</span><span><b>球序</b><small>SMART BADMINTON</small></span></a>
        <nav class="nav" aria-label="主要導覽">
          ${[["總覽", "grid"], ["球員", "users"], ["賽程", "calendar"], ["戰績", "chart"], ["設定", "settings"]].map(([label, i]) => `<button class="nav-item ${state.selectedTab === label ? "active" : ""}" data-tab="${label}">${icon(i)}<span>${label}</span></button>`).join("")}
        </nav>
        <div class="side-footer"><div class="court-dot"></div><span>大安運動中心</span><small>第 2 場地</small></div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div class="crumb"><span>週四晚間場</span><i></i><strong>2026 / 07 / 30</strong></div>
          <div class="top-actions"><button class="icon-control" title="通知">${icon("bell")}</button><button class="profile"><span class="avatar">R</span><span>瑞慈</span></button></div>
        </header>
        <section class="content view-${state.selectedTab}">
          ${state.selectedTab === "總覽" ? `<div class="dashboard-view">
          <div class="page-heading"><div><p class="date-label">THU · JUL 30</p><h1>今日球局</h1><p>${present.length} 位球員已到場，正在進行第 ${state.completed + 1} 場的安排。</p></div><button class="outline-action" data-action="open-settings">${icon("settings")} 排程設定</button></div>
          ${state.notice ? `<div class="notice">${icon("check")} ${state.notice}<button data-action="clear-notice" aria-label="關閉通知">${icon("close", 15)}</button></div>` : ""}
          <div class="metrics" aria-label="今日摘要">
            <article><span>目前人數</span><strong>${present.length}<em>人</em></strong><small><b class="status-dot"></b>全員已簽到</small></article>
            <article><span>已完成</span><strong>${state.completed}<em>場</em></strong><small>目標 20 場</small></article>
            <article><span>下一場</span><strong>第 ${state.completed + 1}<em>場</em></strong><small>2 面場地可用</small></article>
            <article class="fairness"><span>今日公平度</span><strong>97<em>%</em></strong><small>排程平衡良好</small></article>
          </div>
          <section class="next-match" aria-labelledby="next-match-title">
            <div class="match-head"><div><span>AI 智慧推薦</span><h2 id="next-match-title">下一場 · 第 ${state.completed + 1} 場</h2></div><div class="court-label"><b>場地 1</b><small>約 18 分鐘</small></div></div>
            <div class="match-body">
              <div class="team"><p>A 隊</p><div class="players"><div>${playerBadge(m.a[0])}<b>${m.a[0]}</b></div><span>+</span><div>${playerBadge(m.a[1])}<b>${m.a[1]}</b></div></div></div>
              <div class="vs">VS</div>
              <div class="team"><p>B 隊</p><div class="players"><div>${playerBadge(m.b[0])}<b>${m.b[0]}</b></div><span>+</span><div>${playerBadge(m.b[1])}<b>${m.b[1]}</b></div></div></div>
              <div class="match-actions"><button class="primary-action" data-action="start">${icon("play", 17)} 立即開始</button><button class="round-action" data-action="recommend" title="重新推薦">${icon("refresh")}</button></div>
            </div>
            <div class="match-footer"><span>${icon("check", 15)} 避免重複搭檔</span><span>${icon("check", 15)} 強弱平均 4.0 : 3.5</span><span>${icon("check", 15)} 休息分配均衡</span></div>
          </section>
          <div class="dashboard-grid">
            <section class="attendance block"><div class="block-header"><div><span class="section-label">CHECK IN</span><h2>今日到場</h2></div><button class="text-action" data-action="add-player">${icon("plus", 15)} 加入球員</button></div><div class="attendance-list">${players.map((p, index) => `<label class="attendee ${p.present ? "checked" : ""}"><input type="checkbox" data-player="${index}" ${p.present ? "checked" : ""}/><span class="check-box">${icon("check", 14)}</span><span class="mini-avatar avatar-${index % 5}">${initials(p.name)}</span><span class="attendee-name">${p.name}</span>${levelBadge(p.level)}</label>`).join("")}</div></section>
            <section class="schedule block"><div class="block-header"><div><span class="section-label">TODAY'S FLOW</span><h2>今日賽程</h2></div><button class="text-action" data-action="schedule">查看全部</button></div><div class="rounds"><div class="round done"><span>第 7 場</span><p>岳塏・子涵 <b>21 : 16</b> 星宏・沛彤</p><small>已完成</small></div><div class="round done"><span>第 8 場</span><p>健益・瑞慈 <b>18 : 21</b> 季汝・凱均</p><small>已完成</small></div><div class="round live"><span>第 ${state.completed + 1} 場</span><p>${m.a.join("・")} <b>VS</b> ${m.b.join("・")}</p><small>等待開始</small></div></div></section>
            <aside class="insights block"><div class="block-header"><div><span class="section-label">BALANCE</span><h2>公平檢查</h2></div></div><div class="balance-score"><b>97</b><span>/ 100</span><i>平衡良好</i></div>${[["出場次數", "8.0 場", 84], ["休息分配", "平均 7.1 場", 71], ["搭檔覆蓋", "80%", 80]].map(([label, v, w]) => `<div class="meter"><div><span>${label}</span><b>${v}</b></div><i><em style="width:${w}%"></em></i></div>`).join("")}<p class="insight-note">所有球員的出場差距維持在 1 場內。</p></aside>
          </div></div>` : workspaceMarkup(m, present)}
        </section>
      </main>
      <nav class="mobile-nav" aria-label="快速操作"><button data-action="start">${icon("play")}<span>下一場</span></button><button data-action="complete">${icon("check")}<span>完成一場</span></button><button data-action="stats">${icon("chart")}<span>今日統計</span></button><button data-action="attendance">${icon("users")}<span>到場名單</span></button></nav>
    </div>${state.modal ? modalMarkup() : ""}`;
}

function playerBadge(name) { const index = players.findIndex(p => p.name === name); return `<span class="player-avatar avatar-${index % 5}">${initials(name)}</span>`; }
function scheduleRows() {
  const games = [
    ["1", "岳塏・子涵", "星宏・沛彤", "21 : 17", "完成"], ["2", "健益・瑞慈", "季汝・凱均", "19 : 21", "完成"],
    ["3", "岳塏・庭芝", "健益・奕康", "21 : 14", "完成"], ["4", "星宏・凱均", "季汝・子涵", "18 : 21", "完成"],
    ["5", "岳塏・沛彤", "健益・瑞慈", "21 : 18", "完成"], ["6", "星宏・庭芝", "季汝・奕康", "21 : 16", "完成"],
    ["7", "岳塏・子涵", "星宏・沛彤", "21 : 16", "完成"], ["8", "健益・瑞慈", "季汝・凱均", "18 : 21", "完成"],
    ["9", match().a.join("・"), match().b.join("・"), "VS", "等待開始"], ["10", "星宏・子涵", "季汝・沛彤", "VS", "預排"],
    ["11", "岳塏・凱均", "健益・庭芝", "VS", "預排"], ["12", "瑞慈・奕康", "沛彤・子涵", "VS", "預排"],
    ["13", "岳塏・瑞慈", "星宏・凱均", "VS", "預排"], ["14", "健益・沛彤", "季汝・庭芝", "VS", "預排"],
    ["15", "岳塏・奕康", "健益・子涵", "VS", "預排"], ["16", "星宏・瑞慈", "季汝・沛彤", "VS", "預排"],
    ["17", "岳塏・庭芝", "健益・凱均", "VS", "預排"], ["18", "星宏・奕康", "季汝・子涵", "VS", "預排"],
    ["19", "岳塏・沛彤", "健益・瑞慈", "VS", "預排"], ["20", "星宏・庭芝", "季汝・凱均", "VS", "預排"]
  ];
  return games.map(game => state.scores[game[0]] ? [game[0], game[1], game[2], state.scores[game[0]], "完成"] : game);
}
function courtControls() { return `<div class="court-picker" role="group" aria-label="選擇場地數">${state.courtOptions.map(count => `<button class="${state.courts === count ? "active" : ""}" data-action="set-courts" data-courts="${count}">${count} 面</button>`).join("")}<button class="court-add" data-action="add-court" title="新增場地數">${icon("plus", 14)}</button></div>`; }
function workspaceMarkup(m, present) {
  if (state.selectedTab === "賽程") {
    const rows = scheduleRows();
    const courtRows = Array.from({ length: state.courts }, (_, court) => rows.filter((_, index) => index % state.courts === court));
    return `<div class="workspace schedule-workspace"><div class="workspace-heading"><div><p class="date-label">TODAY'S SCHEDULE · 2026 / 07 / 30</p><h1>今日賽程</h1><p>共 20 場，已完成 ${state.completed} 場。可即時調整啟用場地數。</p></div><div class="workspace-actions">${courtControls()}<button class="print-action" data-action="export-pdf">匯出 PDF</button><button class="print-action" data-action="save-scores">儲存計分</button><button class="danger-action" data-action="clear-scores">一鍵清除</button><button class="primary-action" data-action="start">${icon("play", 16)} 開始第 ${state.completed + 1} 場</button></div></div><div class="schedule-summary"><span><b>${present.length}</b> 人到場</span><span><b>${state.courts}</b> 面場地</span><span><b>97%</b> 公平度</span><span><b>12</b> 場已預排</span></div><div class="court-grid courts-${state.courts}" style="--court-count:${state.courts}">${courtRows.map((courtGames, court) => `<section class="court-column"><div class="court-column-title"><span>場地 ${court + 1}</span><small>${court === 0 ? "進行中" : "等待下一輪"}</small></div><div class="schedule-table"><div class="schedule-table-head"><span>場次</span><span>對戰組合</span><span>比數</span><span>狀態</span><span></span></div>${courtGames.map(game => `<div class="schedule-game ${game[4] === "等待開始" ? "next" : ""}"><b>第 ${game[0]} 場</b><span>${game[1]} <i>vs</i> ${game[2]}</span><strong>${game[3]}</strong><em>${game[4]}</em><button class="score-edit" data-action="edit-score" data-game="${game[0]}">${game[4] === "完成" ? "修改" : "輸入"}</button></div>`).join("")}</div></section>`).join("")}</div></div>`;
  }
  if (state.selectedTab === "球員") return `<div class="workspace"><div class="workspace-heading"><div><p class="date-label">PLAYER DIRECTORY</p><h1>球員管理</h1><p>使用 1–15 級檢核標準，等級會即時納入排程計算。</p></div><button class="primary-action" data-action="add-player">${icon("plus", 16)} 新增球員</button></div><div class="player-page-list">${players.map((player, index) => `<div class="player-page-row"><span class="mini-avatar avatar-${index % 5}">${initials(player.name)}</span><b>${player.name}</b>${levelBadge(player.level)}<span class="player-status">${player.present ? "今日已到場" : "尚未到場"}</span><button class="assess-button" data-action="assess-player" data-player-index="${index}">等級檢核</button></div>`).join("")}</div></div>`;
  if (state.selectedTab === "設定") return `<div class="workspace settings-workspace"><div class="workspace-heading"><div><p class="date-label">SCHEDULING RULES</p><h1>排程設定</h1><p>調整場地與公平原則，下一輪與整日賽程會一起更新。</p></div></div><section class="settings-page-section"><div class="section-title-row"><div><h2>啟用場地</h2><p>選擇或新增今晚同時使用的羽球場數。</p></div><button class="text-action" data-action="add-court">${icon("plus", 15)} 新增數量</button></div>${courtControls()}</section><section class="settings-page-section"><div class="section-title-row"><div><h2>平衡原則</h2><p>可停用或新增每次排程都要遵守的條件。</p></div><button class="text-action" data-action="add-rule">${icon("plus", 15)} 新增條件</button></div><div class="rule-grid">${state.rules.map((rule, index) => `<label><input type="checkbox" data-rule="${index}" ${rule.enabled ? "checked" : ""}><span>${rule.label}</span></label>`).join("")}</div></section></div>`;
  return `<div class="workspace"><div class="workspace-heading"><div><p class="date-label">MATCH INSIGHTS</p><h1>${state.selectedTab}</h1><p>完整的${state.selectedTab}資料將在此顯示。</p></div></div></div>`;
}
function modalMarkup() {
  if (state.modal === "player-add") return `<div class="modal-wrap"><div class="modal compact-modal player-add-modal"><button class="modal-close" data-action="close-modal">${icon("close")}</button><span class="section-label">新增球員</span><h2>建立球員資料</h2><p>新增後可立即納入到場名單與下一輪排程。</p><label class="modal-field">姓名<input id="new-player-name" type="text" maxlength="12" placeholder="輸入球員姓名" autofocus></label><label class="modal-field">初始等級<select id="new-player-level">${levelStandards.map(item => `<option value="${item.level}" ${item.level === 6 ? "selected" : ""}>${item.band} ${item.level} 級</option>`).join("")}</select></label><label class="arrival-option"><input id="new-player-present" type="checkbox" checked><span>今日已到場，立即加入排程</span></label><button class="primary-action wide" data-action="save-player">新增球員</button></div></div>`;
  if (state.modal === "court") return `<div class="modal-wrap"><div class="modal compact-modal"><button class="modal-close" data-action="close-modal">${icon("close")}</button><span class="section-label">新增場地數</span><h2>要啟用幾面場地？</h2><p>輸入整數後，賽程會立即依場地數重新分配。</p><label class="modal-field">場地數<input id="new-court-count" type="number" min="1" max="12" value="${state.courts}"></label><button class="primary-action wide" data-action="save-court">新增並啟用</button></div></div>`;
  if (state.modal === "rule") return `<div class="modal-wrap"><div class="modal compact-modal"><button class="modal-close" data-action="close-modal">${icon("close")}</button><span class="section-label">新增平衡原則</span><h2>自訂排程條件</h2><p>例如：避免同一人連續三場上場。</p><label class="modal-field">條件名稱<input id="new-rule-label" type="text" maxlength="36" placeholder="輸入新的平衡條件"></label><button class="primary-action wide" data-action="save-rule">新增條件</button></div></div>`;
  if (state.modal === "score-edit") { const game = scheduleRows().find(row => row[0] === state.scoreGame); return `<div class="modal-wrap"><div class="modal compact-modal"><button class="modal-close" data-action="close-modal">${icon("close")}</button><span class="section-label">手動更新成績</span><h2>第 ${game?.[0]} 場</h2><p>${game?.[1]} vs ${game?.[2]}</p><div class="score-fields"><label>A 隊<input id="manual-score-a" inputmode="numeric" value="${game?.[3]?.split(" : ")[0] === "VS" ? "21" : game?.[3]?.split(" : ")[0]}"></label><b>:</b><label>B 隊<input id="manual-score-b" inputmode="numeric" value="${game?.[3]?.split(" : ")[1] || "18"}"></label></div><button class="primary-action wide" data-action="save-manual-score">更新成績</button></div></div>`; }
  if (state.modal === "score") return `<div class="modal-wrap"><div class="modal"><button class="modal-close" data-action="close-modal">${icon("close")}</button><span class="section-label">完成第 ${state.completed + 1} 場</span><h2>輸入比數</h2><p>${match().a.join("・")} vs ${match().b.join("・")}</p><div class="score-fields"><label>A 隊<input id="score-a" inputmode="numeric" value="21"></label><b>:</b><label>B 隊<input id="score-b" inputmode="numeric" value="18"></label></div><div class="winner-choices"><button class="winner selected" data-winner="A">A 隊獲勝</button><button class="winner" data-winner="B">B 隊獲勝</button></div><button class="primary-action wide" data-action="save-score">完成記錄</button></div></div>`;
  if (state.modal === "settings") return `<div class="modal-wrap"><div class="modal settings-modal"><button class="modal-close" data-action="close-modal">${icon("close")}</button><span class="section-label">排程設定</span><h2>今晚的排程原則</h2><div class="setting-line"><span>場地數</span>${courtControls()}</div><div class="setting-checks">${["避免強 + 強", "避免弱 + 弱", "避免重複搭檔", "避免重複對手", "避免連續上場", "平衡休息時間"].map(x => `<label><input type="checkbox" checked><span>${x}</span></label>`).join("")}</div><button class="primary-action wide" data-action="save-settings">儲存設定</button></div></div>`;
  if (state.modal === "players") return `<div class="modal-wrap"><div class="modal player-modal"><button class="modal-close" data-action="close-modal">${icon("close")}</button><span class="section-label">PLAYER DIRECTORY</span><h2>球員等級管理</h2><p>依照檢核標準更新等級，AI 排程將立即採用。</p><div class="player-directory">${players.map((player, index) => `<div class="player-row"><span class="mini-avatar avatar-${index % 5}">${initials(player.name)}</span><b>${player.name}</b>${levelBadge(player.level)}<button class="assess-button" data-action="assess-player" data-player-index="${index}">檢核</button></div>`).join("")}</div></div></div>`;
  if (state.modal === "assessment") {
    const player = players[state.currentPlayer];
    return `<div class="modal-wrap"><div class="modal assessment-modal"><button class="modal-close" data-action="close-modal">${icon("close")}</button><span class="section-label">LEVEL ASSESSMENT</span><h2>${player.name} 的等級檢核</h2><p>依實際穩定表現選擇最符合的一級，完成後會用於雙打平衡計算。</p><div class="assessment-current">目前等級 ${levelBadge(player.level)} <span>建議逐級比對，不以單一球種判斷。</span></div><div class="criteria-list">${levelStandards.map(item => `<label class="criterion ${state.assessmentLevel === item.level ? "selected" : ""} band-${item.band}"><input type="radio" name="level" value="${item.level}" ${state.assessmentLevel === item.level ? "checked" : ""}><span class="criterion-level">${item.band}<b>${item.level}</b></span><span>${item.description}</span></label>`).join("")}</div><button class="primary-action wide" data-action="save-assessment">確認 ${player.name} 為 ${state.assessmentLevel} 級</button></div></div>`;
  }
  return "";
}

app.addEventListener("click", event => {
  const target = event.target.closest("button"); if (!target) return;
  const { action, tab, winner } = target.dataset;
  if (tab) { state.selectedTab = tab; state.modal = null; state.notice = ""; render(); return; }
  if (winner) { document.querySelectorAll(".winner").forEach(b => b.classList.toggle("selected", b === target)); return; }
  if (action === "recommend") { state.nextIndex = (state.nextIndex + 1) % rotations.length; state.notice = "已根據出場與搭檔紀錄重新推薦下一場。"; render(); }
  if (action === "start") { state.modal = "score"; render(); }
  if (action === "complete") { state.modal = "score"; render(); }
  if (action === "open-settings") { state.modal = "settings"; render(); }
  if (action === "set-courts") { state.courts = Number(target.dataset.courts); state.notice = `已切換為 ${state.courts} 面場地，賽程已重新分配。`; render(); }
  if (action === "add-court") { state.modal = "court"; render(); }
  if (action === "save-court") { const count = Number(document.querySelector("#new-court-count")?.value); if (Number.isInteger(count) && count >= 1 && count <= 12) { if (!state.courtOptions.includes(count)) state.courtOptions.push(count); state.courtOptions.sort((a, b) => a - b); state.courts = count; state.modal = null; state.notice = `已啟用 ${count} 面場地，今日賽程已重新分配。`; render(); } }
  if (action === "add-rule") { state.modal = "rule"; render(); }
  if (action === "save-rule") { const label = document.querySelector("#new-rule-label")?.value.trim(); if (label) { state.rules.push({ label, enabled: true }); state.modal = null; state.notice = `已新增平衡原則：${label}`; render(); } }
  if (action === "edit-score") { state.scoreGame = target.dataset.game; state.modal = "score-edit"; render(); }
  if (action === "save-manual-score") { const a = Number(document.querySelector("#manual-score-a")?.value); const b = Number(document.querySelector("#manual-score-b")?.value); if (Number.isFinite(a) && Number.isFinite(b) && a >= 0 && b >= 0) { state.scores[state.scoreGame] = `${a} : ${b}`; state.modal = null; state.notice = `第 ${state.scoreGame} 場成績已手動更新。`; render(); } }
  if (action === "save-scores") { state.notice = persistScores() ? "計分已儲存到這台裝置的瀏覽器。" : "目前的檔案檢視器不支援本機儲存。"; render(); }
  if (action === "clear-scores") { state.scores = {}; state.completed = 0; const saved = persistScores(); state.notice = saved ? "已清除所有比分並重置完成場次；對戰賽程已保留。" : "已清除目前比分；對戰賽程已保留。"; render(); }
  if (action === "export-pdf") { document.title = "球序-2026-07-30-今日賽程"; window.print(); }
  if (action === "assess-player") { state.currentPlayer = Number(target.dataset.playerIndex); state.assessmentLevel = players[state.currentPlayer].level; state.modal = "assessment"; render(); }
  if (action === "save-assessment") { const player = players[state.currentPlayer]; player.level = state.assessmentLevel; state.modal = "players"; state.notice = `${player.name} 已更新為 ${levelName(player.level)} ${player.level} 級，下一場排程會使用新等級。`; render(); }
  if (action === "close-modal") { state.modal = null; render(); }
  if (action === "save-score") { const a = Number(document.querySelector("#score-a")?.value); const b = Number(document.querySelector("#score-b")?.value); const game = state.completed + 1; if (Number.isFinite(a) && Number.isFinite(b) && a >= 0 && b >= 0) state.scores[game] = `${a} : ${b}`; state.completed += 1; state.nextIndex = (state.nextIndex + 1) % rotations.length; state.modal = null; state.notice = "比賽已完成記錄，AI 已準備好下一場安排。"; render(); }
  if (action === "save-settings") { state.modal = null; state.notice = "排程設定已儲存。"; render(); }
  if (action === "add-player") { state.modal = "player-add"; render(); }
  if (action === "save-player") { const name = document.querySelector("#new-player-name")?.value.trim(); const level = Number(document.querySelector("#new-player-level")?.value); const present = Boolean(document.querySelector("#new-player-present")?.checked); if (!name) { state.notice = "請輸入球員姓名。"; state.modal = null; render(); return; } if (players.some(player => player.name === name)) { state.notice = `${name} 已在球員名單中。`; state.modal = null; render(); return; } players.push({ name, level: Number.isInteger(level) ? level : 6, present }); state.modal = null; state.notice = `${name} 已新增${present ? "並加入今日排程" : "至球員名單"}。`; render(); }
  if (action === "clear-notice") { state.notice = ""; render(); }
  if (["schedule", "stats", "attendance"].includes(action)) { state.notice = action === "stats" ? "今日統計已更新：岳塏勝率 75%，已合作 8 位球員。" : "這個操作已準備好延伸到完整清單。"; render(); }
});

app.addEventListener("change", event => { if (event.target.matches("[data-player]")) { players[Number(event.target.dataset.player)].present = event.target.checked; render(); } });
app.addEventListener("change", event => { if (event.target.matches("input[name=level]")) { state.assessmentLevel = Number(event.target.value); render(); } });
app.addEventListener("change", event => { if (event.target.matches("[data-rule]")) { state.rules[Number(event.target.dataset.rule)].enabled = event.target.checked; render(); } });
render();

    </script>
  </body>
</html>
